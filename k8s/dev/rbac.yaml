apiVersion: v1
kind: ServiceAccount
metadata:
  name: circleguard-app-sa
  namespace: circleguard-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: circleguard-app-role
  namespace: circleguard-dev
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: circleguard-app-rb
  namespace: circleguard-dev
subjects:
  - kind: ServiceAccount
    name: circleguard-app-sa
    namespace: circleguard-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: circleguard-app-role
