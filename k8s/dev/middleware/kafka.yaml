apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-zookeeper
  namespace: circleguard-dev
  labels:
    app: circleguard-zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-zookeeper
  template:
    metadata:
      labels:
        app: circleguard-zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
---
apiVersion: v1
kind: Service
metadata:
  name: circleguard-zookeeper
  namespace: circleguard-dev
  labels:
    app: circleguard-zookeeper
spec:
  type: ClusterIP
  selector:
    app: circleguard-zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-kafka
  namespace: circleguard-dev
  labels:
    app: circleguard-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-kafka
  template:
    metadata:
      labels:
        app: circleguard-kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          ports:
            - containerPort: 29092
            - containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "circleguard-zookeeper:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://localhost:9092,INTERNAL://circleguard-kafka:29092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: circleguard-kafka
  namespace: circleguard-dev
  labels:
    app: circleguard-kafka
spec:
  type: ClusterIP
  selector:
    app: circleguard-kafka
  ports:
    - name: internal
      port: 29092
      targetPort: 29092
    - name: external
      port: 9092
      targetPort: 9092
