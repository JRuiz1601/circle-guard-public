apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-neo4j
  namespace: circleguard-dev
  labels:
    app: circleguard-neo4j
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-neo4j
  template:
    metadata:
      labels:
        app: circleguard-neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.26
          ports:
            - containerPort: 7474
            - containerPort: 7687
          env:
            - name: NEO4J_AUTH
              value: neo4j/password
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_dbms_connector_bolt_listen__address
              value: ":7687"
            - name: NEO4J_dbms_connector_bolt_advertised__address
              value: ":7687"
---
apiVersion: v1
kind: Service
metadata:
  name: circleguard-neo4j
  namespace: circleguard-dev
  labels:
    app: circleguard-neo4j
spec:
  type: ClusterIP
  selector:
    app: circleguard-neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
