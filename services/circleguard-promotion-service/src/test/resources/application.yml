spring:
  datasource:
    url: jdbc:h2:mem:promotion_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password

jwt:
  secret: ThisIsAVeryLongSecretKeyForPromotionTestsOnly1234567890ABCDEF
  expiration: 3600000
