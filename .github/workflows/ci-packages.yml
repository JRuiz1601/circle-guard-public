name: CI - Build & Publish to GHCR

# This workflow validates that GitHub Packages (ghcr.io) is enabled
# and builds/pushes Docker images for all 6 selected microservices.
# It is triggered on push to master or manually.
# NOTE: The main CI/CD is handled by Jenkins. This workflow only
# activates GHCR permissions and provides a fallback build.

on:
  workflow_dispatch:  # Manual trigger to activate GHCR
  push:
    branches:
      - master
    paths:
      - 'services/**'
      - '.github/workflows/**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/jruiz1601

jobs:
  activate-ghcr:
    name: Activate GHCR & Validate Permissions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # <-- This activates ghcr.io for this repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Verify GHCR access
        run: |
          echo "✅ GHCR access verified for user: ${{ github.repository_owner }}"
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Image prefix: ${{ env.IMAGE_PREFIX }}"
          echo "Repo: ${{ github.repository }}"

  build-auth-service:
    name: Build circleguard-auth-service
    runs-on: ubuntu-latest
    needs: activate-ghcr
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
      - name: Build
        run: ./gradlew :services:circleguard-auth-service:build -x test
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/circleguard-auth-service/Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/jruiz1601/circleguard-auth-service:latest
            ghcr.io/jruiz1601/circleguard-auth-service:${{ github.run_number }}

  build-identity-service:
