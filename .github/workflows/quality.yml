name: Code Quality & Security

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  jacoco:
    name: JaCoCo Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
      - name: Run Sprint 2 coverage gate
        run: ./gradlew jacocoSprint2Coverage --continue
      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-sprint2-reports
          path: |
            services/**/build/reports/jacoco/test/html/**
            services/**/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: warn
      - name: Write coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "## JaCoCo Sprint 2 Coverage"
            echo ""
            echo "Coverage gate: auth, identity and gateway require at least 70% line coverage."
            echo ""
            echo "| Service | XML report |"
            echo "| --- | --- |"
            for service in circleguard-auth-service circleguard-identity-service circleguard-gateway-service; do
              report="services/${service}/build/reports/jacoco/test/jacocoTestReport.xml"
              if [[ -f "$report" ]]; then
                echo "| ${service} | ${report} |"
              else
                echo "| ${service} | report not generated |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build for analysis
        run: ./gradlew build -x test --parallel
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  zap:
    name: OWASP ZAP Gateway Scan
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
      - name: Build gateway bootJar
        run: ./gradlew :services:circleguard-gateway-service:bootJar -x test --no-daemon --console=plain
      - name: Start gateway for ZAP
        shell: bash
        env:
          SERVER_PORT: '8080'
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: '6379'
        run: |
          set -euo pipefail
          nohup java -jar services/circleguard-gateway-service/build/libs/circleguard-gateway-service-1.0.0-SNAPSHOT.jar > gateway-zap.log 2>&1 &
          echo "$!" > gateway-zap.pid

          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health; then
              echo "Gateway ready for OWASP ZAP"
              exit 0
            fi
            sleep 2
          done

          echo "Gateway did not become ready for OWASP ZAP"
          cat gateway-zap.log
          exit 1
      - name: OWASP ZAP full scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          target: http://127.0.0.1:8080
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-gateway-report
          cmd_options: '-m 5'
      - name: Upload gateway runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-gateway-runtime-log
          path: gateway-zap.log
          if-no-files-found: warn
      - name: Write ZAP summary
        if: always()
        shell: bash
        run: |
          {
            echo "## OWASP ZAP Gateway Scan"
            echo ""
            echo "Target: http://127.0.0.1:8080"
            echo "Runtime: gateway bootJar + Redis service container in an ephemeral GitHub Actions runner."
            echo "Report artifact: zap-gateway-report"
            echo "Critical findings are not suppressed: fail_action is true."
          } >> "$GITHUB_STEP_SUMMARY"

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Trivy SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
